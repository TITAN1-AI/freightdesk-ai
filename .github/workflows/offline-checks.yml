name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      FREIGHTDESK_RUNTIME_ROOT: C:\FreightDeskRuntime
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Bootstrap pinned project Python
        run: .\scripts\bootstrap.ps1
      - name: Confirm Edge fixture browser is available
        run: |
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          if (-not ($edgeCandidates | Where-Object { Test-Path -LiteralPath $_ })) {
            throw 'The offline browser fixtures require Microsoft Edge on the Windows runner.'
          }
      - name: Full offline suite, lint and dashboard checks
        run: .\scripts\test.ps1
