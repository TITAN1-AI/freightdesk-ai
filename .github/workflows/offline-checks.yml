name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      FREIGHTDESK_RUNTIME_ROOT: C:\FreightDeskRuntime
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Bootstrap pinned project Python
        run: .\scripts\bootstrap.ps1
      - name: Confirm Edge fixture browser is available
        run: |
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          if (-not ($edgeCandidates | Where-Object { Test-Path -LiteralPath $_ })) {
            throw 'The offline browser fixtures require Microsoft Edge on the Windows runner.'
          }
      - name: Check native pipe and pinned-source checkout portability
        run: |
          $testRoot = & .\.tools\python\python.exe -c "from app.core.runtime import RuntimePaths; print(RuntimePaths.from_environment().path('Data', 'TestRuns', 'ci-portability'))"
          if ($LASTEXITCODE -ne 0) { throw 'Test runtime path validation failed.' }
          $env:TEMP = Split-Path $testRoot -Parent
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          $env:TMP = $env:TEMP
          .\.tools\python\python.exe -m pytest tests/test_ascend_native_startup.py tests/test_webbridge_v2_boundaries.py "--basetemp=$testRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Offline portability checks failed.' }
      - name: Full offline suite, lint and dashboard checks
        run: .\scripts\test.ps1
